# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need.
# Must stay compatible with `requires-python` in pyproject.toml.
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# If using Sphinx, optionally build your docs in additional formats such as PDF
# formats:
#    - pdf

# Install GitMA itself (autodoc imports it) together with its `docs` extra.
# Dependency versions therefore come from pyproject.toml - there is no separate
# requirements file to keep in sync.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
